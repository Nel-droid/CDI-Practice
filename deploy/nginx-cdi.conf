# nginx reverse proxy for CDI Practice — single origin (EC2), path-split.
#
#   cdi-practice.uz  ──(Cloudflare, proxied)──►  EC2 (this nginx)
#     /api/*  → Express on 127.0.0.1:8080
#     /health → Express
#     /*      → proxied from the S3 static website (the frontend)
#
# This keeps the frontend on S3 and the API on EC2, same-origin (no CORS), with
# just ONE DNS record (A → the EC2 IP). Cloudflare sits in front for DNS + SSL.
#
# Install on the box:
#   sudo cp deploy/nginx-cdi.conf /etc/nginx/sites-available/cdi
#   sudo ln -s /etc/nginx/sites-available/cdi /etc/nginx/sites-enabled/cdi
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# S3 static website endpoint (HTTP-only; nginx talks to it over HTTP internally).
# The bucket must have Static website hosting enabled, with BOTH the index and
# error documents set to index.html (so the SPA's client-side routes resolve).
upstream s3_site {
    server cdi-practice-frontend.s3-website-us-east-1.amazonaws.com:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name cdi-practice.uz www.cdi-practice.uz;
    return 301 https://cdi-practice.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdi-practice.uz www.cdi-practice.uz;

    # Cloudflare Origin certificate (create in Cloudflare → SSL/TLS → Origin Server).
    ssl_certificate     /etc/ssl/cloudflare/cdi-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cdi-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # ── API → Express ──
    location = /health { proxy_pass http://127.0.0.1:8080; access_log off; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI calls (writing feedback) can take ~20-30s
        proxy_send_timeout 120s;
    }

    # ── Everything else → S3 static site ──
    location / {
        proxy_pass http://s3_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # S3 website routing is Host-based, so send it the bucket's website host:
        proxy_set_header Host cdi-practice-frontend.s3-website-us-east-1.amazonaws.com;
        proxy_set_header Accept-Encoding "";
    }
}
