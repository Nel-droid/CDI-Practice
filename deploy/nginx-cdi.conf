# nginx reverse proxy for CDI Practice — single origin (EC2), path-split.
# No Cloudflare: the domain points straight at this box, SSL via Let's Encrypt.
#
#   cdi-practice.uz  ──►  EC2 (this nginx)
#     /api/*  → Express on 127.0.0.1:8080
#     /health → Express
#     /*      → proxied from the S3 static website (the frontend)
#
# Install on the box:
#   sudo cp deploy/nginx-cdi.conf /etc/nginx/sites-available/cdi
#   sudo ln -s /etc/nginx/sites-available/cdi /etc/nginx/sites-enabled/cdi
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then get SSL (adds the 443 block + redirect automatically):
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d cdi-practice.uz
# (DNS must already point to this box and port 80 must be open first.)

# S3 static website endpoint (HTTP-only). The bucket needs Static website hosting
# enabled with BOTH index and error documents set to index.html (SPA routing).
upstream s3_site {
    server cdi-practice-frontend.s3-website-us-east-1.amazonaws.com:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name cdi-practice.uz www.cdi-practice.uz;

    client_max_body_size 2m;

    # ── API → Express ──
    location = /health { proxy_pass http://127.0.0.1:8080; access_log off; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI calls (writing feedback) can take ~20-30s
        proxy_send_timeout 120s;
    }

    # ── Everything else → S3 static site ──
    location / {
        proxy_pass http://s3_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # S3 website routing is Host-based, so send it the bucket's website host:
        proxy_set_header Host cdi-practice-frontend.s3-website-us-east-1.amazonaws.com;
        proxy_set_header Accept-Encoding "";
    }
}
