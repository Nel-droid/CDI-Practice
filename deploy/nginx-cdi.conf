# nginx reverse proxy for CDI Practice (Option A: same-origin via Cloudflare).
#
# Cloudflare fronts one hostname and routes ONLY /api/* (and /health) to this
# EC2 origin; everything else is served from the S3 static site by Cloudflare.
# So this origin only needs to handle /api and /health, and terminate a
# Cloudflare Origin certificate.
#
# Install: copy to /etc/nginx/sites-available/cdi, symlink into sites-enabled,
#   sudo ln -s /etc/nginx/sites-available/cdi /etc/nginx/sites-enabled/cdi
#   sudo nginx -t && sudo systemctl reload nginx
# Replace cdi.example.com with your real domain when you have it.

# --- Trust Cloudflare so real client IPs are logged (optional but recommended) ---
# Keep this list current from https://www.cloudflare.com/ips/  (v4 + v6).
# set_real_ip_from 173.245.48.0/20;  (… add all Cloudflare ranges …)
# real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name cdi.example.com;
    # Redirect any plain HTTP to HTTPS (Cloudflare talks to the origin over 443).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdi.example.com;

    # Cloudflare Origin certificate (create in Cloudflare > SSL/TLS > Origin Server).
    ssl_certificate     /etc/ssl/cloudflare/cdi-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cdi-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m; # essays + webhooks are small

    # Health check (used by nginx smoke tests / uptime monitors).
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # The API — everything the frontend calls at /api/*.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI calls (writing feedback) can take ~20-30s — give them headroom.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # This origin serves nothing else; the SPA is on S3 via Cloudflare.
    location / {
        return 404;
    }
}
