<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDI Practice</title>
    <meta name="description" content="Computer-delivered IELTS practice — authentic Cambridge Reading, Listening and Writing under real exam conditions, marked against the passage line that proves each answer." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          // Resolve the saved theme mode (System / Light / Dark) before paint.
          var mode = localStorage.getItem('cdi-theme-mode')
          var theme = (mode === 'light' || mode === 'dark')
            ? mode
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
          // Explicit reduce-motion override, applied before first paint so no
          // animation flashes before React reads the preference.
          if (localStorage.getItem('cdi-reduce-motion') === '1') {
            document.documentElement.setAttribute('data-reduce-motion', 'on')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
